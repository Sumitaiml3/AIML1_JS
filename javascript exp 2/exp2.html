<!DOCTYPE html>
<html>
<head>
    <title>Experiment 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        input, select {
            width: 90%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 2px;
        }
        button:hover {
            background-color: #218838;
        }
        .action-btns button {
            background-color: #007bff;
        }
        .action-btns button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Employee Management System</h2>

        <label>Employee Name:</label>
        <input type="text" id="empName" placeholder="Enter Name">

        <label>Employee ID:</label>
        <input type="text" id="empId" placeholder="Enter ID">

        <label>Salary (₹):</label>
        <input type="number" id="empSalary" placeholder="Enter Salary">

        <label>Department:</label>
        <select id="empDept">
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="Finance">Finance</option>
        </select>

        <button onclick="addEmployee()">Add Employee</button>

        <hr>

        <div class="action-btns">
            <button onclick="displayAll()">Display All</button>
            <button onclick="filterSalary()">Filter Salary > 50k</button>
            <button onclick="calcTotalSalary()">Total Salary</button>
            <button onclick="calcAvgSalary()">Average Salary</button>
            <button onclick="countDept()">Count in IT Dept</button>
        </div>

        <div id="output">Results will appear here...</div>
    </div>

    <script src="exp2.js"></script>
</body>
</html>
