<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Manipulation</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            background: #f4f4f4;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            margin: 8px;
            padding: 10px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 90%;
            margin: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 id="heading">Welcome to My Webpage</h1>
    <p id="para">This is a sample paragraph for DOM manipulation.</p>
    <input type="text" id="inputText" placeholder="Enter new heading text">
    <br>
    <button id="changeText">Change Heading</button>
    <button id="changeColor">Change Background</button>
    <button id="increaseFont">Increase Font Size</button>
    <button id="togglePara">Show/Hide Paragraph</button>
</div>
<script src='exp3.js'></script>
</body>
</html>
