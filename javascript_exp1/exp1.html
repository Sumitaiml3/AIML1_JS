<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            width: 90%;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Result Calculator</h2>

    <input type="number" id="subjects" placeholder="Enter number of subjects">
    <button onclick="getMarks()">Enter Marks</button>

    <div id="marksInput"></div>

    <button onclick="calculateResult()">Calculate Result</button>

    <div class="result" id="output"></div>
</div>

<script src="exp1.js"></script>

</body>
</html>
